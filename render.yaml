services:
  - type: web
    name: backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r ../requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://frontend.onrender.com
      - key: MAX_FILE_SIZE
        value: "52428800"

  - type: static
    name: frontend
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    publishDir: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://backend.onrender.com

databases:
  - name: postgres
    plan: free
