services:
  - type: web
    name: ai-research-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r ../requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-research-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://ai-research-frontend.onrender.com
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: SUMMARIZATION_MODEL
        value: facebook/bart-large-cnn
      - key: RERANKER_MODEL
        value: cross-encoder/ms-marco-MiniLM-L-6-v2
      - key: CHUNK_SIZE
        value: "700"
      - key: CHUNK_OVERLAP
        value: "100"
      - key: TOP_K
        value: "8"
      - key: RERANK_TOP_K
        value: "5"
      - key: MAX_FILE_SIZE
        value: "52428800"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: VECTOR_DB_PATH
        value: /tmp/vector_db
  - type: web
    name: ai-research-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    publishDir: build
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REACT_APP_API_URL
        value: https://ai-research-backend.onrender.com
databases:
  - name: ai-research-db
    plan: free
