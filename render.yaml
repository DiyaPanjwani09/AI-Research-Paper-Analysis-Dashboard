services:
  - type: web
    name: ai-research-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-research-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: ai-research-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: SUMMARIZATION_MODEL
        value: facebook/bart-large-cnn
      - key: RERANKER_MODEL
        value: cross-encoder/ms-marco-MiniLM-L-6-v2
      - key: CHUNK_SIZE
        value: "700"
      - key: CHUNK_OVERLAP
        value: "100"
      - key: TOP_K
        value: "8"
      - key: RERANK_TOP_K
        value: "5"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: VECTOR_DB_PATH
        value: /tmp/vector_db

  - type: web
    name: ai-research-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: ai-research-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: ai-research-db
    plan: free
